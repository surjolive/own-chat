version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: surjo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: surjo_whatsapp_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - surjo-net

  redis:
    image: redis:7-alpine
    container_name: surjo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - surjo-net

volumes:
  postgres-data:

networks:
  surjo-net:
    driver: bridge
